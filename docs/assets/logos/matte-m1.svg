<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Solid dark matte canvas -->
    <linearGradient id="matteBg1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <!-- Crisp satin gradient on the mark (no blur/glow) -->
    <linearGradient id="markGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="markGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base Frame with crisp 1px border -->
  <rect x="28" y="28" width="456" height="456" rx="104" fill="url(#matteBg1)"/>
  <rect x="28" y="28" width="456" height="456" rx="104" fill="none" stroke="#1F2937" stroke-width="2"/>

  <!-- Upper Blade (Crisp, Solid, Zero Glow) -->
  <path d="M 364 156
           L 364 120
           C 364 96 342 78 296 78
           L 216 78
           C 160 78 128 108 128 154
           C 128 198 162 222 218 240
           L 294 264
           L 262 222
           L 210 206
           C 180 196 168 184 168 160
           C 168 134 188 118 226 118
           L 286 118
           C 314 118 326 128 326 144
           L 326 156
           Z"
        fill="url(#markGrad1)"/>

  <!-- Lower Blade (Crisp, Inverse Mirror) -->
  <path d="M 148 356
           L 148 392
           C 148 416 170 434 216 434
           L 296 434
           C 352 434 384 404 384 358
           C 384 314 350 290 294 272
           L 218 248
           L 250 290
           L 302 306
           C 332 316 344 328 344 352
           C 344 378 324 394 286 394
           L 226 394
           C 198 394 186 384 186 368
           L 186 356
           Z"
        fill="url(#markGrad2)"/>

  <!-- Center Diagonal Sweeping Slice (Pure Negative Space Accent) -->
  <polygon points="196,252 316,260 296,280 176,272" fill="#38BDF8" opacity="0.9"/>
</svg>
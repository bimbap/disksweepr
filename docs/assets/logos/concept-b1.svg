<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1626"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="sGradTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="sGradBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#67E8F9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Subtle Radial Ambient Glow -->
  <circle cx="256" cy="256" r="140" fill="#2563EB" opacity="0.12" filter="blur(30px)"/>

  <!-- S-Monogram: Dynamic Upper Sweep -->
  <path d="M 370 148 
           C 370 120 330 92 256 92 
           C 182 92 142 120 142 160 
           C 142 196 172 216 230 236 
           L 300 260 
           C 340 274 350 286 350 292
           L 350 238
           C 350 220 326 206 280 192
           L 220 174
           C 192 164 184 154 184 146
           C 184 130 208 120 256 120
           C 300 120 328 132 334 148
           Z" 
        fill="url(#sGradTop)" filter="url(#glow)"/>

  <!-- S-Monogram: Dynamic Lower Sweep -->
  <path d="M 142 364 
           C 142 392 182 420 256 420 
           C 330 420 370 392 370 352 
           C 370 316 340 296 282 276 
           L 212 252 
           C 172 238 162 226 162 220
           L 162 274
           C 162 292 186 306 232 320
           L 292 338
           C 320 348 328 358 328 366
           C 328 382 304 392 256 392
           C 212 392 184 380 178 364
           Z" 
        fill="url(#sGradBottom)" filter="url(#glow)"/>
</svg>